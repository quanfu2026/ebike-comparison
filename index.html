data.push(...[{"r": 12, "n": "BESV JR1", "w": 16, "wt": "M：16 kg；XS：15.7 kg（篩選採M）", "price": 78800, "p": "NT$78,800（官方建議售價）", "era": "台灣官網未列本批年式，請洽交車門市", "rng": "Eco最高100 km／Power 55 km（官方條件測試）", "brk": "Shimano 105 油壓碟煞", "ctl": "扭力感測 / Eco、Smart、Power", "spc": "非折疊公路車 / 700×25C / Shimano 105 22速 / 36V 7Ah 252Wh / 250W後輪馬達", "war": "授權通路第一手車主：車架／非避震前叉5年、電控含電池2年、非耗材1年；依原廠條款", "str": "BESV授權門市；高雄交車點、尺寸現貨與試乘請先詢問", "maps": [], "sources": [{"label": "官方規格與定價", "url": "https://www.besv.com.tw/jr1"}, {"label": "官方保固", "url": "https://www.besv.com.tw/warranty"}, {"label": "通路交車門市", "url": "https://www.hotaigo.com.tw/productdetail/hotai72264-uu0-003-231.html"}], "foldable": false, "sc": [3, 3, 3, 3], "checked": "2026-11-13"}, {"r": 13, "n": "Acer ebii", "w": 23.5, "wt": "23.5 kg（含電池與擋泥板）", "price": 78990, "p": "NT$78,990（7-ELEVEN i預購通路標價；庫存待確認）", "era": "官網未列本批年式，請洽通路", "rng": "最高110 km（官方標示，依使用條件變動）", "brk": "160 mm液壓碟煞", "ctl": "ebiiAssist 自動助力 / 48V CAN控制 / 手機連線、後方雷達", "spc": "非折疊城市車 / 20×2.2吋 / 單速皮帶 / 可拆電池 / 250W輪轂馬達；電池頁面單位460W待確認", "war": "保固期限與適用條件待通路提供書面保證；洽倚天酷碁支援", "str": "7-ELEVEN i預購；高雄實體展示／試乘點待確認", "maps": [], "sources": [{"label": "官方規格", "url": "https://www.acer.com/ebii/tw-zh/index.html"}, {"label": "78,990元通路頁", "url": "https://711go.7-11.com.tw/product/270028"}, {"label": "官方服務支援", "url": "https://www.acergadget.com/customer-support/"}], "foldable": false, "sc": [3, 3, 3, 3], "checked": "2026-11-13"}, {"r": 14, "n": "GIANT FastRoad E+（2026）", "w": 20, "wt": "約20 kg（官方；實車依尺寸及配備）", "price": 79800, "p": "NT$79,800（台灣官方售價）", "era": "2026年式（台灣官方產品頁）", "rng": "官方情境估算55／110／180 km（Extreme／Good／Ideal），非固定續航", "brk": "TEKTRO 油壓碟煞", "ctl": "SyncDrive Sport中置70 Nm / 六感測器 / RideControl Ergo / RideDash Evo", "spc": "非折疊平把車 / 700×38C / Shimano 10速 / Panasonic 500Wh / 可另購250Wh增程電池", "war": "本次未核實完整保固年限；請依台灣原廠保證書與交車條款", "str": "台灣捷安特門市；高雄尺寸、庫存與試乘須先確認", "maps": [], "sources": [{"label": "台灣官方價格／規格", "url": "https://www.giant-bicycles.com/tw/fastroad-eplus"}, {"label": "官方門市查詢", "url": "https://www.giant-bicycles.com/tw/stores"}], "foldable": false, "sc": [3, 3, 3, 3], "checked": "2026-11-13"}]);

let bVal="all", wVal=99, fVal="all", idx=0;
const labels = new Array("價格 CP 值", "搬運輕巧度", "保固與售後", "動力與續航");

function renderMapButtons(maps){
  if(!maps || !maps.length) return "";
  return `<div class="map-links">` + maps.map(m =>
    `<a class="map-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.q)}" target="_blank" rel="noopener">📍 ${m.label}</a>`
  ).join("") + `</div>`;
}

function getList(){
  return data.filter(d => {
    const match=bVal==='all' || (bVal==='u20' && d.price<=20000) || (bVal==='u40' && d.price<=40000) || (bVal==='u60' && d.price<=60000) || (bVal==='40to60' && d.price>40000 && d.price<=60000) || (bVal==='50to60' && d.price>=50000 && d.price<=60000) || (bVal==='70to80' && d.price>=70000 && d.price<=80000) || (bVal==='90to100' && d.price>=90000 && d.price<=100000);
    return match && d.w<=wVal && (fVal==='all' || d.foldable===(fVal==='yes'));
  });
}
function emptyMessage(){
  if(bVal==='70to80' && fVal==='yes') return '7～8萬元折疊電輔車：尚未確認符合條件車款，資料待補（查核：2026-11-13）';
  return '無符合目前預算、重量與折疊條件的車款；其他資料持續補充';
}
function renderSources(d){
  if(!d.sources) return '<small style="display:block;color:#5f6368">原1.0資料，尚未逐項複核</small>';
  return '<small style="display:block">查核：'+d.checked+'<br>'+d.sources.map(s=>`<a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.label}</a>`).join(' · ')+'</small>';
}

function getRankedList(){
  return getList().slice().map(d=>({...d,tot:d.sc.reduce((a,b)=>a+b,0)})).sort((a,b)=>b.tot-a.tot);
}

function render(){
  const list = getList();
  document.getElementById("tBody").innerHTML = list.map(d=>`<tr>
    <td><span class="tag">#${d.r}</span></td>
    <td><b>${d.n}</b>${renderSources(d)}<br><small style="color:#5f6368">${d.spc}</small></td>
    <td>${d.foldable ? "可折疊" : "不可折疊"}</td><td><b>${d.wt}</b></td>
    <td><span class="tag tag-g">${d.p}</span></td>
    <td>${d.era}</td>
    <td>${d.rng}</td>
    <td><b>剎車：</b>${d.brk}<br><b>操控：</b>${d.ctl}</td>
    <td><b>保固：</b>${d.war}<br><b>管道：</b>${d.str}${renderMapButtons(d.maps)}</td>
  </tr>`).join("") || `<tr><td colspan="9" style="text-align:center;padding:20px">${emptyMessage()}</td></tr>`;

  if(idx>=list.length) idx=0;
  const cBody=document.getElementById("cBody"), cIdx=document.getElementById("cIdx");
  if(!list.length){ cIdx.textContent="0 / 0"; cBody.innerHTML=`<p>${emptyMessage()}</p>`; }
  else {
    const d=list[idx];
    cIdx.textContent=`第 ${idx+1} 筆 / 共 ${list.length} 筆（車款編號 #${d.r}）`;
    cBody.innerHTML=`<h2 style="margin:0 0 12px;color:#1a73e8">${d.n} <span class="tag">${d.wt}</span></h2> <div class="grid"> <div class="item"><b>可否折疊</b>${d.foldable ? "可折疊" : "不可折疊"}</div><div class="item"><b>參考售價／條件</b>${d.p}</div> <div class="item"><b>出品／改款年代</b>${d.era}</div> <div class="item"><b>官方行駛距離</b>${d.rng}</div> <div class="item"><b>剎車系統</b>${d.brk}</div> <div class="item"><b>操控系統與助力</b>${d.ctl}</div> <div class="item"><b>電池、馬達與變速</b>${d.spc}</div> <div class="item"><b>保固與售後</b>${d.war}</div> <div class="item"><b>購買與高雄試乘點（點擊開啟地圖）</b>${d.str}${renderMapButtons(d.maps)}</div><div class="item"><b>來源與查核日期</b>${renderSources(d)}</div> </div>`;
}
  renderScores();
}

function setTab(name, button){
  for(const view of ['table','card','score']){
    document.getElementById(view+'View').style.display = view===name ? 'block' : 'none';
  }
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b===button));
}

function step(direction){
  const count=getList().length;
  idx=count ? (idx+direction+count)%count : 0;
  render();
}

function renderScores(){
  const list=getRankedList();
  document.getElementById('sBody').innerHTML=list.map((d,i)=>`
    <div class="s-card" data-id="${d.r}">
      <h3 style="margin:0 0 10px">第 ${i+1} 名：${d.n}</h3><span class="tag">${d.foldable ? "可折疊" : "不可折疊"}</span>
      ${labels.map((label,j)=>`<div class="s-row"><label for="score-${d.r}-${j}">${label}</label><output id="value-${d.r}-${j}">${d.sc[j]}</output></div>
      <input id="score-${d.r}-${j}" type="range" min="1" max="5" step="1" value="${d.sc[j]}" style="width:100%" data-id="${d.r}" data-score="${j}" aria-label="${d.n} ${label}">`).join('')}
      <div class="tot">總分：${d.tot} / 20</div>
    </div>`).join('') || `<p>${emptyMessage()}</p>`;
}

document.getElementById('sBody').addEventListener('input',event=>{
  const input=event.target;
  if(!input.matches('input[type="range"]')) return;
  data.find(d=>d.r===Number(input.dataset.id)).sc[Number(input.dataset.score)]=Number(input.value);
  document.getElementById(`value-${input.dataset.id}-${input.dataset.score}`).textContent=input.value;
  const d=data.find(d=>d.r===Number(input.dataset.id));
  input.closest('.s-card').querySelector('.tot').textContent=`總分：${d.sc.reduce((a,b)=>a+b,0)} / 20`;
});
document.getElementById('sBody').addEventListener('change',event=>{
  if(event.target.matches('input[type="range"]')) renderScores();
});

for(const id of ['bFilter','wFilter','fFilter']){
  document.getElementById(id).addEventListener('click',event=>{
    const button=event.target.closest('button');
    if(!button) return;
    if(id==='bFilter') bVal=button.dataset.v;
    else if(id==='fFilter') fVal=button.dataset.v;
    else wVal=Number(button.dataset.v);
    idx=0;
    document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('active',b===button));
    render();
  });
}

function exportScoreCSV(){
  const rows=[['評分排名','車款名稱','可否折疊','車重','參考售價／條件',...labels,'總分'],
    ...getRankedList().map((d,i)=>[i+1,d.n,d.foldable ? "可折疊" : "不可折疊",d.wt,d.p,...d.sc,d.tot])];
  const csv='\uFEFF'+rows.map(row=>row.map(value=>'"'+String(value).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  const link=document.createElement('a');
  link.href=url;
  link.download='電輔車個人評分.csv';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

render();
</script>
